<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declare both themes up front so the browser paints the right canvas colour immediately. -->
    <meta name="color-scheme" content="light dark" />
    <title>MemoryAtlas</title>
    <script>
      // Apply a saved appearance before first paint so there is no flash of the wrong theme.
      // Light is the default; "system" leaves the attribute off so the device decides.
      try { var t = localStorage.getItem("memoryatlas-theme"); if (t !== "system") document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
