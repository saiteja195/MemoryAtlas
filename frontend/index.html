<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declare both themes up front so the browser paints the right canvas colour immediately. -->
    <meta name="color-scheme" content="light dark" />
    <title>MemoryAtlas</title>
    <script>
      // Apply a saved appearance before first paint so there is no flash of the wrong theme.
      try { var t = localStorage.getItem("memoryatlas-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
