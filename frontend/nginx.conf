server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads arrive base64-encoded: a 10-minute voice note is about 26 MB, and a video preview is up to 4
    # frames plus its audio. 100m covers the largest request the backend accepts.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The browser calls /api/...; the backend serves the same paths without the prefix, exactly as the
    # Vite dev proxy does (the trailing slash on proxy_pass strips "/api").
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # The sign-in limits count attempts per client address. Behind Caddy the first entry is the visitor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        # An answer from the live model, or forgetting with its leak check, can take minutes on a slow day.
        proxy_read_timeout 600s;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path (including ?as=device&grant=...) serves the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
