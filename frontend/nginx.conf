server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos arrive base64-encoded in the capture endpoints.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The browser calls /api/...; the backend serves the same paths without the prefix, exactly as the
    # Vite dev proxy does (the trailing slash on proxy_pass strips "/api").
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # An answer from the live model can take a while.
        proxy_read_timeout 180s;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path (including ?as=device&grant=...) serves the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
