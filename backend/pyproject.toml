[project]
name = "memoryatlas"
version = "0.1.0"
description = "Consent-aware, evidence-backed temporal memory graph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
