# Use together with the main file; it is an override, not a replacement:
#
#   docker compose -f compose.yaml -f deploy/compose.public.yaml up -d --build
#
# The web container stops publishing a host port, and Caddy publishes 80 and 443 with automatic HTTPS
# in front. People sign in with their own profile (see docs/DEPLOY.md).
name: memoryatlas

services:
  web:
    ports: !reset []

  proxy:
    image: caddy:2
    depends_on:
      web:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your domain, e.g. mynotes.duckdns.org}
    ports:
      # On a VM keep the defaults: the certificate is issued over ports 80 and 443. Change them only to
      # try this out on a machine where those ports are taken (a real domain will then not get a certificate).
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [memoryatlas]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:
